workflows:
  ios-workflow:
    name: iOS IPA Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
        - tag
      branches:
        - main
        - master
    scripts:
      - name: Get Flutter dependencies
        script: |
          flutter packages pub get

      - name: Clean stale configs & precache iOS
        script: |
          rm -f ios/Flutter/Generated.xcconfig
          flutter precache --ios
          cd ios && pod install --repo-update && cd ..

      - name: Build iOS Release App
        script: |
          flutter build ios --release --no-codesign

      - name: Package Unsigned IPA (Payload)
        script: |
          mkdir -p build/ios/ipa
          if [ -d "build/ios/iphoneos/Runner.app" ]; then
            cd build/ios/iphoneos
            mkdir -p Payload
            cp -r Runner.app Payload/
            zip -r ../../../build/ios/ipa/sakani_app.ipa Payload
            cp ../../../build/ios/ipa/sakani_app.ipa ../../../sakani_app.ipa
          elif [ -d "build/ios/archive/Runner.xcarchive" ]; then
            cd build/ios/archive/Runner.xcarchive/Products/Applications
            mkdir -p Payload
            cp -r Runner.app Payload/
            zip -r ../../../../build/ios/ipa/sakani_app.ipa Payload
            cp ../../../../build/ios/ipa/sakani_app.ipa ../../../../sakani_app.ipa
          fi

    artifacts:
      - build/ios/ipa/*.ipa
      - sakani_app.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      email:
        recipients:
          - bodagwad@gmail.com
        notify:
          success: true
          failure: true

